site_name: jax-learning
site_url: https://stevenwman.github.io/jax-learning/
site_description: JAX-based reinforcement learning for robot learning
repo_url: https://github.com/stevenwman/jax-learning
repo_name: stevenwman/jax-learning
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - path: https://unpkg.com/mathjax@3.2.2/es5/tex-chtml.js
    defer: true

theme:
  name: material
  icon:
    logo: material/robot-industrial
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - navigation.footer
    - toc.follow

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
  nav:
    omitted_files: warn

hooks:
  - docs/scripts/glossary_links.py

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Concepts: getting-started/concepts.md
  - Tutorials:
    - tutorials/index.md
    - Train Locomotion: tutorials/train-locomotion.md
    - Custom Environment: tutorials/custom-env.md
    - Custom Rewards: tutorials/custom-rewards.md
    - Sim-to-Real: tutorials/sim2real.md
    - Asymmetric Critic: tutorials/asymmetric-critic.md
  - API Reference:
    - api/index.md
    - Algorithms: api/algos.md
    - Environments: api/envs.md
    - Push Environments: api/push-env.md
    - PushT (vendored DP): api/pusht.md
    - Configs: api/configs.md
    - Buffers: api/buffers.md
    - Wrappers: api/wrappers.md
    - Networks: api/networks.md
  - Reference:
    - reference/index.md
    - CLI Flags: reference/cli-flags.md
    - Environment Presets: reference/env-presets.md
    - Architecture: reference/architecture.md
    - Training Loop: reference/training-loop.md
    - Lessons Learned: reference/lessons-learned.md
    - Contributing: contributing.md
  - FAQ: faq.md
  - Glossary: glossary.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stevenwman/jax-learning
