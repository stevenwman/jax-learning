site_name: jax-learning
site_url: https://stevenwman.github.io/jax-learning/
site_description: JAX-based reinforcement learning for robot learning
repo_url: https://github.com/stevenwman/jax-learning
repo_name: stevenwman/jax-learning

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  icon:
    logo: material/robot-industrial
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - navigation.footer

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Concepts: getting-started/concepts.md
  - Tutorials:
    - Train Locomotion: tutorials/train-locomotion.md
    - Custom Environment: tutorials/custom-env.md
    - Custom Rewards: tutorials/custom-rewards.md
    - Sim-to-Real: tutorials/sim2real.md
    - Asymmetric Critic: tutorials/asymmetric-critic.md
  - API Reference:
    - Algorithms: api/algos.md
    - Environments: api/envs.md
    - Configs: api/configs.md
    - Buffers: api/buffers.md
    - Wrappers: api/wrappers.md
    - Networks: api/networks.md
  - Background:
    - CLI Flags: reference/cli-flags.md
    - Environment Presets: reference/env-presets.md
    - Architecture: reference/architecture.md
    - Lessons Learned: reference/lessons-learned.md
    - Glossary: glossary.md
  - FAQ: faq.md
  - Contributing: contributing.md
